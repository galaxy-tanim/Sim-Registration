<div class="w"><div class="hd"><div class="lg"></div><h2>SIM Registration</h2></div>

<div id="lg"><label>Email</label><input id="le" type="email" autocomplete="username"><label style="margin-top:8px">Password</label><input id="lp" type="password" autocomplete="current-password"><button type="button" id="lb2" style="width:100%;margin-top:12px">Login</button></div>
<div id="rg" style="display:none"><label>Full name</label><input id="rn" autocomplete="name"><label style="margin-top:8px">Email</label><input id="re" type="email"><label style="margin-top:8px">Designation</label><input id="rd"><label style="margin-top:8px">Password (at least 8 characters)</label><input id="rp" type="password" autocomplete="new-password">

</div><button id="b">Submit</button><div id="m"></div></form>

<script>
const SUPABASE_URL="https://cwxisgurozexjqnuwwkt.supabase.co", SUPABASE_ANON_KEY="sb_publishable_Yq8e2agdV9Zy2fMb1cWB8A_u_gy7kPE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), m=$('m');
const say=(t,ok)=>{m.style.display='block';m.className=ok?'ok':'er';m.textContent=t};
const ERR={login:'Please log in again.',notfound:'This ICCID is not in our records.',used:'This SIM is already registered.',invalid:'Please fill in all fields correctly.'};
function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.8)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
$('f').onsubmit=async e=>{
  e.preventDefault();$('b').disabled=true;
  const v=Object.fromEntries(new FormData($('f')));
  const args={p_name:v.name,p_nid:v.nid,p_dob:v.dob,p_iccid:v.iccid,p_msisdn:v.msisdn,p_token:tok};
  try{
    const nid=v.nid.replace(/\D/g,''),ms=v.msisdn.replace(/\D/g,''),ic=v.iccid.replace(/\D/g,''),today=new Date().toISOString().slice(0,10);
    if(![10,13,17].includes(nid.length)){say('NID must be 10, 13 or 17 digits.');return}
    if(!v.dob||v.dob>today||v.dob<'1900-01-01'){say('Please enter a valid date of birth.');return}
    if(ic.length<18||ic.length>22){say('ICCID must be 18 to 22 digits (printed on the SIM card).');return}
    if(ms.length<10||ms.length>13){say('Please enter a valid phone number.');return}
    if(!cFaces){say('Please complete the face check with the camera first.');return}
    let r=await sb.rpc('register_sim2',args);                 // 1. dry check
    if(r.error)throw r.error;
    if(r.data.r!=='ok'){if(r.data.r==='login')chk('Please log in again.');say(ERR[r.data.r]||'Error.');return}
    const front=await putFaces('photos','reg/'+uid(),cFaces);
    r=await sb.rpc('register_sim2',{...args,p_image_path:front});
    if(r.error)throw r.error;
    if(r.data.r==='registered'){say('Registration successful!',true);showQR(r.data.link,ic);$('f').reset();cFaces=null;$('pfaces').innerHTML=''}
    else say(ERR[r.data.r]||'Error.');
  }catch(x){say(x===undefined?'Could not read this photo. Please use a JPG or PNG.':'Something went wrong. Please try again.')}
  finally{$('b').disabled=false}
};

let tok=null;const LS='simTok',FALLBACK='engrhabiburweb@gmail.com';
const amsg=(t,ok)=>{$('am').style.cssText='margin-top:10px;color:'+(ok?'#16794a':'#c62828');$('am').textContent=t||''};
function show(inn,name){$('au').style.display=inn?'none':'block';$('f').style.display=inn?'block':'none';$('sb').style.display=inn?'flex':'none';if(inn)$('sn').textContent=name;else $('done').style.display='none'}

async function chk(msg){let t=null;try{t=localStorage.getItem(LS)}catch(e){}
  if(t){const {data}=await sb.rpc('staff_check',{p_token:t});if(data){tok=t;show(true,data);return}}
  tok=null;try{localStorage.removeItem(LS)}catch(e){}show(false);if(msg)amsg(msg,0)}
$('lb2').onclick=async()=>{amsg('');
  const {data,error}=await sb.rpc('staff_login',{p_email:$('le').value.trim(),p_password:$('lp').value});
  if(error)return amsg('Something went wrong. Try again.',0);

/* ---------- guided face check: look straight, then turn right, then turn left ---------- */
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/',uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
let faceReady=null,sFaces=null,cFaces=null;
function loadFace(){if(!faceReady)faceReady=(async()=>{if(!window.faceapi)throw 0;await faceapi.nets.tinyFaceDetector.loadFromUri(MODELS);await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODELS);return true})().catch(()=>false);return faceReady}
function faceCheck(){return new Promise(async res=>{
  const ov=$('fcv'),v=$('fv'),oval=$('fov'),tx=$('ftx'),dots=[...$('fd').children],man=$('fm');
  let stream=null,alive=true,step=0,sign=0,hold=0;const shots=[];
  const STEPS=['Look straight at the camera','Slowly turn your head to the right','Now slowly turn your head to the left'];
  const stop=r=>{alive=false;if(stream)stream.getTracks().forEach(t=>t.stop());ov.style.display='none';res(r)};
  $('fx').onclick=()=>stop(null);
  ov.style.display='flex';tx.textContent='Opening the camera...';man.style.display='none';dots.forEach(d=>d.className='');oval.className='oval';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false});v.srcObject=stream;await v.play()}
  catch(e){tx.textContent='The camera is not available. Allow camera access and try again.';setTimeout(()=>stop(null),2500);return}
  const ml=await loadFace();
  const shot=()=>new Promise(r=>{const c=document.createElement('canvas'),s=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.85)});
  const next=async()=>{shots.push(await shot());dots[step].className='on';oval.className='oval ok';step++;hold=0;
    if(step>=3){tx.textContent='Done. Thank you!';setTimeout(()=>stop({front:shots[0],right:shots[1],left:shots[2]}),700);return}
    setTimeout(()=>{oval.className='oval';tx.textContent=STEPS[step]},700)};
  tx.textContent=STEPS[0];
  if(!ml){man.style.display='inline-block';man.onclick=next;return}
  let busy=false;
  const loop=async()=>{if(!alive)return;
    if(!busy&&v.videoWidth&&step<3){busy=true;
      try{const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5})).withFaceLandmarks(true);
        if(d&&alive){const p=d.landmarks.positions,L=p[0].x,R=p[16].x,dev=(p[30].x-L)/(R-L)-.5,b=d.detection.box,cx=(b.x+b.width/2)/v.videoWidth;
          let ok=false;
          if(step===0)ok=b.width/v.videoWidth>.22&&Math.abs(dev)<.07&&cx>.3&&cx<.7;
          else if(step===1)ok=Math.abs(dev)>.14;
          else ok=Math.abs(dev)>.14&&Math.sign(dev)===-sign;
          hold=ok?hold+1:0;
          if(hold>=(step===0?5:3)){if(step===1)sign=Math.sign(dev);await next()}
        }else hold=0}catch(e){}
      busy=false}
    setTimeout(loop,120)};
  loop()})}
function showFaces(el,f){el.innerHTML=['front','right','left'].map(k=>'<figure><img src="'+URL.createObjectURL(f[k])+'" alt=""><figcaption>'+k[0].toUpperCase()+k.slice(1)+'</figcaption></figure>').join('')}
async function putFaces(bucket,base,f){for(const k of ['front','right','left']){const u=await sb.storage.from(bucket).upload(base+'-'+k+'.jpg',f[k],{contentType:'image/jpeg'});if(u.error)throw u.error}return base+'-front.jpg'}
$('co').onclick=async()=>{const f=await faceCheck();if(f){sFaces=f;showFaces($('sfaces'),f);amsg('')}};
$('pco').onclick=async()=>{const f=await faceCheck();if(f){cFaces=f;showFaces($('pfaces'),f);say('')}};
function deviceName(){const u=navigator.userAgent;let d='Unknown device';
  if(/Android/.test(u)){const m=/Android [\d.]+;\s*([^;)]+)/.exec(u);d='Android '+(m?m[1].replace(/ Build.*/,'').trim():'phone')}
  else if(/iPhone/.test(u))d='iPhone';else if(/iPad/.test(u))d='iPad';else if(/Windows/.test(u))d='Windows PC';else if(/Mac OS/.test(u))d='Mac';else if(/Linux/.test(u))d='Linux PC';
  const b=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'Browser';return d+' / '+b}
$('rs').onclick=async()=>{
  const n=$('rn').value.trim(),e=$('re').value.trim().toLowerCase(),d=$('rd').value.trim(),p=$('rp').value;
  if(n.length<2||!/^\S+@\S+\.\S+$/.test(e)||d.length<2)return amsg('Enter your name, a valid email and your designation.',0);
  if(p.length<8)return amsg('The password must have at least 8 characters.',0);
  if(!sFaces)return amsg('Complete the face check with the camera first.',0);
  $('rs').disabled=true;
  try{
    const base='staff/'+uid(),front=await putFaces('staff-selfies',base,sFaces);
    const r=await sb.rpc('staff_signup',{p_name:n,p_email:e,p_designation:d,p_password:p,p_image_path:front});if(r.error)throw r.error;
    if(r.data.r!=='ok')return amsg(r.data.r==='exists'?'This email already has a request or an account. Try logging in.':'Please check your details.',0);
    const {data:to}=await sb.rpc('get_notify_email'),fd=new FormData(),url=k=>sb.storage.from('staff-selfies').getPublicUrl(base+'-'+k+'.jpg').data.publicUrl;
    fd.append('_subject','SIM Registration - New staff access request');fd.append('_template','box');fd.append('_captcha','false');
    Object.entries({Message:'Someone asked for access to the SIM registration page. Their details and face photos are below. Do you accept? Open the panel to accept or deny.',Name:n,Email:e,Designation:d,Device:deviceName(),When:new Date().toString(),'Face (front)':url('front'),'Face (right)':url('right'),'Face (left)':url('left'),'Open the panel':new URL('admin.html',location.href).href+'#staff'}).forEach(([k,v])=>fd.append(k,v));
    fetch('https://formsubmit.co/ajax/'+(to||FALLBACK),{method:'POST',headers:{Accept:'application/json'},body:fd}).catch(()=>{});
    amsg('Request sent. You can log in after the primary admin accepts it.',1);sFaces=null;$('sfaces').innerHTML='';['rn','re','rd','rp'].forEach(i=>$(i).value='');
  }catch(x){amsg('Could not send the request. Try again.',0)}finally{$('rs').disabled=false}};
setTab(false);chk();
